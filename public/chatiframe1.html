<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>CHAT</title>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script type="module" src="/js/chatiframe1-1.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
    
    * {
      box-sizing: border-box;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: 
        radial-gradient(circle at 20% 50%, rgba(0, 255, 255, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 255, 0.05) 0%, transparent 50%),
        linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
      background-attachment: fixed;
      background-color: #0a0a0a;
      color: #e0e0e0;
      /* Explicit font stack - no system font fallbacks that might trigger Japanese font probing */
      font-family: 'Share Tech Mono', 'Courier New', 'Courier', 'Lucida Console', 'Monaco', 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.6;
    }
    
    /* Scan lines overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 255, 255, 0.02) 0px,
        rgba(0, 255, 255, 0.02) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 1;
    }
    
    html, body {
      height: 100%;
      margin: 0;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 100%;
      position: relative;
      z-index: 10;
    }
    
    .chat-header {
      padding: 12px 16px;
      border-bottom: 2px solid rgba(0, 255, 255, 0.4);
      background: 
        linear-gradient(180deg, rgba(20, 20, 30, 0.95) 0%, rgba(10, 10, 20, 0.98) 100%);
      backdrop-filter: blur(10px);
      box-shadow: 
        0 4px 20px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(0, 255, 255, 0.3),
        0 0 40px rgba(0, 255, 255, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .chat-title {
      font-size: 18px;
      font-weight: 700;
      font-family: 'Orbitron', 'Share Tech Mono', 'Courier New', 'Courier', 'Lucida Console', 'Monaco', 'Consolas', monospace;
      color: #00ffff;
      text-shadow: 
        0 0 10px rgba(0, 255, 255, 1),
        0 0 20px rgba(0, 255, 255, 0.8),
        0 0 30px rgba(0, 255, 255, 0.6);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0;
    }
    
    .current-channel {
      font-size: 12px;
      color: rgba(0, 255, 255, 0.7);
      text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
    }
    
    .chat-status {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .relay-status {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 11px;
    }
    
    .relay-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
      box-shadow: 0 0 4px rgba(255, 68, 68, 0.5);
    }
    
    .relay-dot.connected {
      background: #00ff7f;
      box-shadow: 0 0 8px rgba(0, 255, 127, 0.8);
    }
    
    .relay-dot.connecting {
      background: #ffd700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .auth-trigger {
      margin-left: 8px;
      width: 26px;
      height: 26px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 255, 0.4);
      background: rgba(0, 255, 255, 0.08);
      color: #00ffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    
    .auth-trigger:hover {
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
    }
    
    .auth-current {
      margin: 10px 0 14px;
      font-size: 12px;
      color: rgba(0, 255, 255, 0.8);
      word-break: break-all;
    }
    .auth-current .key-value {
      color: #00ff7f;
      font-weight: 700;
    }
    .auth-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
    }
    .auth-input-row input {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 255, 0.3);
      background: rgba(0, 255, 255, 0.08);
      color: #00ffff;
      font-family: 'Courier New', monospace;
    }
    .auth-input-row button {
      padding: 10px 12px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 255, 0.5);
      background: rgba(0, 255, 255, 0.15);
      color: #00ffff;
      cursor: pointer;
    }
    .auth-input-row button:hover {
      background: rgba(0, 255, 255, 0.25);
    }
    .auth-modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: transparent;
      border: none;
      color: #00ffff;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }
    .auth-modal-close:hover {
      color: #ff00ff;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 6px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      -webkit-overflow-scrolling: touch;
    }
    
    .message {
      padding: 2px 4px;
      background: rgba(15, 15, 30, 0.5);
      font-size: 12px;
      line-height: 1.3;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    
    .message-new-user {
      margin-top: 8px;
    }
    
    .message-username {
      color: #00ffff;
      text-shadow: 0 0 4px rgba(0, 255, 255, 0.4);
      margin-right: 6px;
    }
    
    .message-time {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.3);
      margin-right: 6px;
    }
    
    .message-channel {
      font-size: 10px;
      color: rgba(255, 200, 0, 0.7);
      margin-right: 6px;
      cursor: pointer;
    }
    
    .message-channel:hover {
      color: #ffd700;
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.8);
    }
    
    .message-content {
      color: #e0e0e0;
      display: inline;
    }
    
    .message-song-link {
      display: inline;
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      font: inherit;
      line-height: inherit;
      color: #6ee7ff;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
      text-align: left;
    }
    
    .message-song-link:hover {
      color: #00ffff;
      text-shadow: 0 0 6px rgba(0, 255, 255, 0.45);
    }
    
    .message-actions {
      display: inline;
      margin-left: 8px;
      font-size: 10px;
    }
    
    .message-action {
      color: rgba(0, 255, 255, 0.5);
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 2px;
    }
    
    .message-action:hover {
      color: #00ffff;
      background: rgba(0, 255, 255, 0.1);
    }
    
    .reaction-count {
      color: rgba(255, 255, 255, 0.5);
    }
    
    .chat-input-area {
      padding: 4px;
      background: 
        linear-gradient(180deg, rgba(10, 10, 20, 0.98) 0%, rgba(20, 20, 30, 0.95) 100%);
      backdrop-filter: blur(10px);
    }
    
    .chat-input {
      width: 100%;
      padding: 6px 8px;
      background: rgba(10, 10, 30, 0.8);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 2px;
      color: #e0e0e0;
      font-family: 'Share Tech Mono', 'Courier New', 'Courier', 'Lucida Console', 'Monaco', 'Consolas', monospace;
      font-size: 13px;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      box-shadow: 
        inset 0 1px 2px rgba(0, 255, 255, 0.1),
        0 0 8px rgba(0, 255, 255, 0.1);
    }
    
    .chat-input:focus {
      outline: none;
      border-color: rgba(0, 255, 255, 0.6);
      box-shadow: 
        inset 0 1px 2px rgba(0, 255, 255, 0.2),
        0 0 15px rgba(0, 255, 255, 0.3);
    }
    
    
    .auth-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
      padding-top: 40px;
    }
    
    .auth-modal-content {
      background: 
        linear-gradient(135deg, rgba(20, 20, 40, 0.95) 0%, rgba(10, 10, 30, 0.98) 100%);
      border: 2px solid rgba(0, 255, 255, 0.4);
      border-radius: 8px;
      padding: 24px;
      max-width: 500px;
      width: 90%;
      box-shadow: 
        0 0 40px rgba(0, 255, 255, 0.3),
        inset 0 1px 2px rgba(0, 255, 255, 0.2);
    }
    
    .auth-modal h3 {
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
      margin-top: 0;
      font-family: 'Orbitron', 'Share Tech Mono', 'Courier New', 'Courier', 'Lucida Console', 'Monaco', 'Consolas', monospace;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .auth-option {
      margin: 12px 0;
      padding: 12px;
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 4px;
      background: rgba(0, 255, 255, 0.05);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .auth-option:hover {
      border-color: rgba(0, 255, 255, 0.6);
      background: rgba(0, 255, 255, 0.1);
    }
    
    .auth-option-title {
      color: #00ffff;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .auth-option-desc {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
    }
    
    .auth-input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      background: rgba(10, 10, 30, 0.8);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 4px;
      color: #e0e0e0;
      font-family: 'Share Tech Mono', 'Courier New', 'Courier', 'Lucida Console', 'Monaco', 'Consolas', monospace;
      font-size: 12px;
    }
    
    .auth-button {
      padding: 8px 16px;
      margin: 4px;
      background: 
        linear-gradient(135deg, rgba(20, 20, 40, 0.9) 0%, rgba(10, 10, 30, 0.95) 100%);
      border: 2px solid rgba(0, 255, 127, 0.6);
      border-radius: 4px;
      color: #00ff7f;
      font-family: 'Share Tech Mono', 'Courier New', 'Courier', 'Lucida Console', 'Monaco', 'Consolas', monospace;
      font-size: 12px;
      cursor: pointer;
      text-transform: lowercase;
      letter-spacing: 1px;
    }
    
    .auth-button:hover {
      border-color: #00ff7f;
      box-shadow: 0 0 15px rgba(0, 255, 127, 0.4);
    }
    
    .error-message {
      padding: 12px;
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid rgba(255, 68, 68, 0.3);
      border-radius: 4px;
      color: #ff4444;
      margin: 12px;
      font-size: 12px;
    }
    
    .loading {
      text-align: center;
      padding: 24px;
      color: rgba(0, 255, 255, 0.6);
      font-size: 12px;
    }
    
    /* Scrollbar styling */
    .chat-messages::-webkit-scrollbar {
      width: 8px;
    }
    
    .chat-messages::-webkit-scrollbar-track {
      background: rgba(10, 10, 30, 0.5);
    }
    
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 255, 0.3);
      border-radius: 4px;
    }
    
    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 255, 255, 0.5);
    }
  </style>
</head>
<body x-data="chatApp()" x-init="init()">
  <div class="chat-container">
    <template x-if="!minimalEmbed">
      <div class="chat-header">
        <div>
          <h2 class="chat-title">chat</h2>
        </div>
        <div class="chat-status">
          <div class="relay-status" x-show="relays.length > 0">
            <!-- Render exactly 2 dots (one for each relay) -->
            <template x-for="(relay, index) in relays.slice(0, 2)" :key="index">
              <div class="relay-dot" 
                   :class="relayStatus[relay]?.status || 'disconnected'"
                   :title="relay"></div>
            </template>
          </div>
          <button class="auth-trigger" @click="showAuthModal = true" title="Show key options">🔑</button>
        </div>
      </div>
    </template>
    
    <div class="chat-messages" x-ref="messagesContainer">
      <template x-if="errorMessage">
        <div class="error-message" x-text="errorMessage"></div>
      </template>
      
      <template x-if="safeMessages.length === 0 && !isLoading">
        <div class="loading">No messages yet. Be the first to chat!</div>
      </template>
      
      <template x-if="isLoading">
        <div class="loading">Loading messages...</div>
      </template>
      
      <template x-for="(message, index) in safeMessages" :key="getMessageKey(message, index)">
        <div class="message" :class="{ 'message-new-user': !isSameUserAsPrevious(index) }"><span class="message-time" x-show="!isSameUserAsPrevious(index)" x-text="formatTime(message.created_at)"></span><span class="message-username" x-show="!isSameUserAsPrevious(index)" x-text="getUsername(message.pubkey)"></span><span class="message-channel" x-show="getMessageChannel(message)" x-text="getMessageChannel(message)" @click="tuneToChannel(getMessageChannel(message))"></span><span class="message-content" x-html="formatMessageContentHtml(message.content)" @click="onMessageContentClick($event)"></span><span class="message-actions" x-show="isAuthenticated"><span class="message-action" @click="reactToMessage(message.id, '👍')" x-show="message.pubkey !== currentUserPubkey">👍<span class="reaction-count" x-text="getReactionCount(message.id, '👍')"></span></span><span class="message-action" @click="deleteMessage(message.id)" x-show="message.pubkey === currentUserPubkey">×</span></span></div>
      </template>
    </div>
    
    <div class="chat-input-area">
      <textarea 
        x-model="messageInput"
        @keydown="handleKeyDown($event)"
        @focus="checkAuthOnFocus()"
        x-ref="chatInput"
        class="chat-input"
        placeholder="Type your message... (Enter to send, Shift+Enter for new line)"
        rows="1"
        autofocus></textarea>
    </div>
    
    <template x-if="showAuthModal && !minimalEmbed">
      <div class="auth-modal" 
           @click.self="showAuthModal = false" 
           @keydown.escape="showAuthModal = false" 
           x-ref="authModal"
          x-effect="if (showAuthModal) { $nextTick(() => { $refs.authModal?.focus(); if (!currentUserPrivateKey && $refs.nsecInput) { $refs.nsecInput.focus(); } }); }"
           tabindex="-1">
        <div class="auth-modal-content">
          <button class="auth-modal-close" @click="showAuthModal = false" aria-label="Close">×</button>
          <h3>Nostr keys</h3>

          <!-- Unified key display -->
          <div class="auth-current">
            <div style="margin-bottom: 12px;">
              <div style="margin-bottom: 6px; font-size: 12px; color: rgba(0, 255, 255, 0.8);">nsec:</div>
              <div class="auth-input-row">
                <template x-if="currentUserPrivateKey">
                  <input :type="showPrivateKey ? 'text' : 'password'" readonly :value="currentUserNsec || currentUserPrivateKey">
                </template>
                <template x-if="!currentUserPrivateKey">
                  <input 
                    type="text" 
                    x-model="manualKey" 
                    placeholder="nsec1..." 
                    @keydown.enter="authenticateWithKey()"
                    x-ref="nsecInput">
                </template>
                <template x-if="currentUserPrivateKey">
                  <button @click="showPrivateKey = !showPrivateKey" x-text="showPrivateKey ? 'hide' : 'show'"></button>
                </template>
              </div>
            </div>
            
            <div>
              <div style="margin-bottom: 6px; font-size: 12px; color: rgba(0, 255, 255, 0.8);">npub:</div>
              <div class="auth-input-row">
                <input type="text" readonly :value="currentUserNpub || ''" placeholder="npub not available" style="width: 100%;">
              </div>
            </div>
            
            <template x-if="currentUserNip05">
              <div style="margin-top: 12px;">
                <div style="margin-bottom: 6px; font-size: 12px; color: rgba(0, 255, 255, 0.8);">NIP-05:</div>
                <div class="auth-input-row">
                  <input type="text" readonly :value="currentUserNip05" style="width: 100%; color: #00ff88;">
                </div>
              </div>
            </template>
            
            <template x-if="!currentUserPrivateKey && !currentUserPubkey">
              <div style="margin-top: 12px;">
                <button @click="generateNewKey()" class="auth-button" style="width: 100%;">generate keys</button>
              </div>
            </template>
            
            
            <template x-if="currentUserPrivateKey || currentUserPubkey">
              <div style="margin-top: 12px;">
                <button @click="deleteKeys()" class="auth-button" style="width: 100%; background: rgba(255, 0, 100, 0.15); border-color: rgba(255, 0, 100, 0.5); color: #ff0064;">delete keys</button>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>
  </div>
  
  <script src="/js/chatiframe1-2.js"></script>
</body>
</html>
