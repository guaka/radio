  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    
    html {
      font-size: 16px;
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    
    /* Scan lines overlay for retro-futuristic effect - static to prevent flickering */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 255, 255, 0.02) 0px,
        rgba(0, 255, 255, 0.02) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 1;
    }
    
    /* Glitch effect overlay - static to prevent flickering */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(90deg, transparent 50%, rgba(0, 255, 255, 0.01) 50%),
        linear-gradient(0deg, transparent 50%, rgba(255, 0, 255, 0.01) 50%);
      background-size: 2px 2px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.2;
    }
    
    html, body {
      background: 
        radial-gradient(circle at 20% 50%, rgba(0, 255, 255, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 255, 0.05) 0%, transparent 50%),
        linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
      background-attachment: fixed;
      background-color: #0a0a0a;
      color: #e0e0e0;
      margin: 0;
      padding: 0;
      font-family: 'Share Tech Mono', 'Courier New', 'Courier', 'Lucida Console', 'Monaco', 'Consolas';
      font-size: 1rem;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0 clamp(8px, 1.5vw, 15px);
      box-sizing: border-box;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: visible;
      position: relative;
      z-index: 10;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      width: 100%;
    }

    header {
      padding: 0;
      margin: 0;
      border-bottom: 2px solid rgba(0, 255, 255, 0.4);
      background: 
        linear-gradient(180deg, rgba(20, 20, 30, 0.95) 0%, rgba(10, 10, 20, 0.98) 100%),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 2px,
          rgba(0, 255, 255, 0.05) 2px,
          rgba(0, 255, 255, 0.05) 4px
        );
      backdrop-filter: blur(10px);
      box-shadow: 
        0 4px 20px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(0, 255, 255, 0.3),
        0 0 40px rgba(0, 255, 255, 0.2),
        0 0 60px rgba(0, 255, 255, 0.1);
      position: relative;
      z-index: 10;
    }
    
    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, 
        transparent 0%,
        rgba(0, 255, 255, 1) 20%,
        rgba(255, 0, 255, 1) 50%,
        rgba(0, 255, 255, 1) 80%,
        transparent 100%
      );
      box-shadow: 
        0 0 10px rgba(0, 255, 255, 0.8),
        0 0 20px rgba(0, 255, 255, 0.5),
        0 0 30px rgba(255, 0, 255, 0.4);
      z-index: 1;
    }

    header .container {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: clamp(8px, 2vw, 12px);
      justify-content: space-between;
      padding: clamp(4px, 0.8vh, 8px) clamp(8px, 1.5vw, 15px) 0 clamp(8px, 1.5vw, 15px);
      flex-wrap: wrap;
    }
    
    header .volume-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      padding: 8px 12px;
      background: 
        linear-gradient(135deg, rgba(20, 20, 40, 0.8) 0%, rgba(10, 10, 30, 0.9) 100%);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 6px;
      box-shadow: 
        inset 0 1px 2px rgba(0, 255, 255, 0.2),
        0 0 15px rgba(0, 255, 255, 0.3),
        0 0 25px rgba(0, 255, 255, 0.2);
    }
    
    header .volume-control span {
      font-size: clamp(14px, 2.5vw, 18px);
      filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.9)) drop-shadow(0 0 16px rgba(0, 255, 255, 0.5));
    }
    
    header .volume-control input[type="range"] {
      -webkit-appearance: slider-vertical;
      appearance: slider-vertical;
      writing-mode: bt-lr;
      width: 80px;
      height: 6px;
      transform: rotate(-90deg);
      transform-origin: center;
      margin: 25px 0;
      padding: 0;
      cursor: pointer;
      background: 
        linear-gradient(90deg, 
          rgba(0, 0, 0, 0.8) 0%,
          rgba(0, 255, 255, 0.2) 50%,
          rgba(0, 0, 0, 0.8) 100%
        );
      border-radius: 3px;
      outline: none;
      border: 1px solid rgba(0, 255, 255, 0.3);
      box-shadow: 
        inset 0 1px 3px rgba(0, 0, 0, 0.5),
        0 0 8px rgba(0, 255, 255, 0.2);
    }
    
    header .volume-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: 
        radial-gradient(circle, #00ffff 0%, #0080ff 100%);
      border: 2px solid rgba(0, 255, 255, 0.8);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 
        0 0 15px rgba(0, 255, 255, 1),
        0 0 30px rgba(0, 255, 255, 0.7),
        0 0 45px rgba(0, 255, 255, 0.4),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
      transition: all 0.2s ease;
    }
    
    header .volume-control input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 
        0 0 20px rgba(0, 255, 255, 1),
        0 0 40px rgba(0, 255, 255, 0.8),
        0 0 60px rgba(0, 255, 255, 0.5),
        inset 0 1px 2px rgba(255, 255, 255, 0.5);
      transform: scale(1.1);
    }
    
    header .volume-control input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: 
        radial-gradient(circle, #00ffff 0%, #0080ff 100%);
      border: 2px solid rgba(0, 255, 255, 0.8);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 
        0 0 15px rgba(0, 255, 255, 1),
        0 0 30px rgba(0, 255, 255, 0.7),
        0 0 45px rgba(0, 255, 255, 0.4);
    }

    header h1 {
      margin: 0;
      display: flex;
      align-items: center;
      gap: clamp(8px, 2vw, 12px);
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 700;
      font-family: 'Orbitron', 'Share Tech Mono', 'Courier New', 'Courier', 'Lucida Console', 'Monaco', 'Consolas';
      color: #00ffff;
      text-shadow: 
        0 0 10px rgba(0, 255, 255, 1),
        0 0 20px rgba(0, 255, 255, 0.8),
        0 0 30px rgba(0, 255, 255, 0.6),
        0 0 40px rgba(0, 255, 255, 0.4),
        2px 2px 4px rgba(0, 0, 0, 0.8);
      letter-spacing: 2px;
      text-transform: uppercase;
      position: relative;
      line-height: 1.2;
    }

    header h1 .logo-icon {
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1;
      display: inline-flex;
      align-items: center;
      filter: drop-shadow(0 0 10px rgba(255, 200, 0, 1)) drop-shadow(0 0 20px rgba(255, 200, 0, 0.6)) drop-shadow(0 0 30px rgba(255, 200, 0, 0.3));
      /* animation: radio-pulse 3s ease-in-out infinite; */
    }
    
    @keyframes radio-pulse {
      0%, 100% { 
        transform: scale(1); 
        filter: drop-shadow(0 0 10px rgba(255, 200, 0, 1)) drop-shadow(0 0 20px rgba(255, 200, 0, 0.6)) drop-shadow(0 0 30px rgba(255, 200, 0, 0.3));
      }
      50% { 
        transform: scale(1.05); 
        filter: drop-shadow(0 0 15px rgba(255, 200, 0, 1)) drop-shadow(0 0 30px rgba(255, 200, 0, 0.8)) drop-shadow(0 0 45px rgba(255, 200, 0, 0.5));
      }
    }

    header h1 strike {
      color: rgba(255, 0, 255, 0.6);
      text-decoration: line-through;
      text-shadow: 0 0 5px rgba(255, 0, 255, 0.5);
    }

    header audio {
      display: none;
    }
    
    header input[type="range"]:not(.volume-control input) {
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: 
        linear-gradient(90deg, 
          rgba(0, 0, 0, 0.8) 0%,
          rgba(0, 255, 255, 0.2) 50%,
          rgba(0, 0, 0, 0.8) 100%
        );
      border-radius: 3px;
      outline: none;
      border: 1px solid rgba(0, 255, 255, 0.3);
      box-shadow: 
        inset 0 1px 3px rgba(0, 0, 0, 0.5),
        0 0 8px rgba(0, 255, 255, 0.2);
    }
    
    header input[type="range"]:not(.volume-control input)::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: 
        radial-gradient(circle, #00ffff 0%, #0080ff 100%);
      border: 2px solid rgba(0, 255, 255, 0.8);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 
        0 0 8px rgba(0, 255, 255, 0.8),
        0 0 16px rgba(0, 255, 255, 0.4);
    }
    
    header input[type="range"]:not(.volume-control input)::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: 
        radial-gradient(circle, #00ffff 0%, #0080ff 100%);
      border: 2px solid rgba(0, 255, 255, 0.8);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 
        0 0 8px rgba(0, 255, 255, 0.8),
        0 0 16px rgba(0, 255, 255, 0.4);
    }

    header > div > div:not(.volume-control) {
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.5vw, 10px);
      font-size: clamp(11px, 2vw, 13px);
      color: #aaa;
      flex-wrap: wrap;
    }
    
    .header-controls-wrapper {
      display: flex;
      align-items: center;
      gap: clamp(8px, 2vw, 12px);
      flex-wrap: wrap;
      width: 100%;
    }
    
    .header-controls-audio {
      flex: 1;
      min-width: 0;
      width: 100%;
    }
    
    .header-channel-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    .header-channel-info-row {
      display: flex;
      align-items: flex-start;
      gap: clamp(8px, 1.5vw, 12px);
      width: 100%;
      min-width: 0;
    }

    .header-channel-art {
      width: clamp(44px, 9vw, 56px);
      height: clamp(44px, 9vw, 56px);
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
      border: 1px solid rgba(0, 255, 255, 0.35);
      box-shadow:
        0 0 10px rgba(0, 255, 255, 0.25),
        inset 0 0 0 1px rgba(255, 0, 255, 0.08);
    }

    .header-channel-text-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      flex: 1;
    }


    article {
      padding: clamp(12px, 2.5vh, 24px) 0 clamp(50px, 7vh, 60px) 0;
      flex: 1;
      overflow-y: visible;
      overflow-x: hidden;
      min-height: 0;
      background: 
        radial-gradient(circle at 50% 0%, rgba(0, 255, 255, 0.02) 0%, transparent 50%);
      position: relative;
      z-index: 10;
      -webkit-overflow-scrolling: touch;
    }
    
    article .container {
      height: auto;
      overflow: visible;
      min-height: 0;
    }

    #channels {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(4px, 1.2vw, 8px);
      margin-bottom: clamp(10px, 2vh, 20px);
    }

    /* Button styles - oldschool radio + cyberpunk */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: clamp(3px, 0.6vh, 4px) clamp(6px, 1.2vw, 10px);
      font-size: clamp(11px, 2vw, 13px);
      font-weight: 400;
      font-family: 'Share Tech Mono', 'Courier New', 'Courier', 'Lucida Console', 'Monaco', 'Consolas';
      line-height: 1.4;
      text-align: center;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      border: 2px solid rgba(255, 68, 68, 0.6);
      border-radius: 4px;
      text-decoration: none;
      color: #ff4444;
      text-transform: lowercase;
      letter-spacing: 1px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 26px;
      position: relative;
      overflow: hidden;
      background: 
        linear-gradient(135deg, rgba(20, 20, 40, 0.9) 0%, rgba(10, 10, 30, 0.95) 100%),
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 1px,
          rgba(255, 68, 68, 0.03) 1px,
          rgba(255, 68, 68, 0.03) 2px
        );
      box-shadow: 
        inset 0 1px 2px rgba(255, 68, 68, 0.2),
        inset 0 -1px 2px rgba(0, 0, 0, 0.5),
        0 2px 4px rgba(0, 0, 0, 0.6),
        0 0 12px rgba(255, 68, 68, 0.3),
        0 0 20px rgba(255, 68, 68, 0.2);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, 
        transparent, 
        rgba(255, 68, 68, 0.3), 
        transparent
      );
      transition: left 0.4s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: #ff4444;
      box-shadow: 
        inset 0 1px 2px rgba(255, 68, 68, 0.4),
        inset 0 -1px 2px rgba(0, 0, 0, 0.5),
        0 4px 8px rgba(0, 0, 0, 0.7),
        0 0 20px rgba(255, 68, 68, 0.6),
        0 0 35px rgba(255, 68, 68, 0.4),
        0 0 50px rgba(255, 68, 68, 0.2);
      text-shadow: 
        0 0 10px rgba(255, 68, 68, 1),
        0 0 20px rgba(255, 68, 68, 0.8),
        0 0 30px rgba(255, 68, 68, 0.5);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 
        inset 0 2px 4px rgba(0, 0, 0, 0.8),
        0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .btn-large {
      padding: clamp(4px, 0.7vh, 5px) clamp(8px, 1.8vw, 12px);
      font-size: clamp(11px, 2.2vw, 13px);
      min-height: 28px;
    }

    .btn-primary {
      border-color: rgba(138, 43, 226, 0.6);
      color: #da70d6;
      box-shadow: 
        inset 0 1px 2px rgba(138, 43, 226, 0.2),
        inset 0 -1px 2px rgba(0, 0, 0, 0.5),
        0 2px 4px rgba(0, 0, 0, 0.6),
        0 0 8px rgba(138, 43, 226, 0.1);
    }
    
    .btn-primary:hover {
      border-color: #da70d6;
      color: #ff00ff;
      text-shadow: 0 0 8px rgba(255, 0, 255, 0.8);
      box-shadow: 
        inset 0 1px 2px rgba(138, 43, 226, 0.3),
        inset 0 -1px 2px rgba(0, 0, 0, 0.5),
        0 4px 8px rgba(0, 0, 0, 0.7),
        0 0 15px rgba(255, 0, 255, 0.4),
        0 0 25px rgba(255, 0, 255, 0.2);
    }

    .btn-success {
      border-color: rgba(0, 255, 127, 0.6);
      color: #00ff7f;
      box-shadow: 
        inset 0 1px 2px rgba(0, 255, 127, 0.2),
        inset 0 -1px 2px rgba(0, 0, 0, 0.5),
        0 2px 4px rgba(0, 0, 0, 0.6),
        0 0 8px rgba(0, 255, 127, 0.1),
        0 0 15px rgba(0, 255, 127, 0.2);
      /* animation: active-glow 2s ease-in-out infinite; */
    }
    
    @keyframes active-glow {
      0%, 100% { 
        box-shadow: 
          inset 0 1px 2px rgba(0, 255, 127, 0.2),
          inset 0 -1px 2px rgba(0, 0, 0, 0.5),
          0 2px 4px rgba(0, 0, 0, 0.6),
          0 0 8px rgba(0, 255, 127, 0.1),
          0 0 15px rgba(0, 255, 127, 0.2);
      }
      50% { 
        box-shadow: 
          inset 0 1px 2px rgba(0, 255, 127, 0.3),
          inset 0 -1px 2px rgba(0, 0, 0, 0.5),
          0 2px 4px rgba(0, 0, 0, 0.6),
          0 0 12px rgba(0, 255, 127, 0.3),
          0 0 25px rgba(0, 255, 127, 0.4);
      }
    }

    .btn-success:hover {
      border-color: #00ff7f;
      color: #00ffaa;
      text-shadow: 0 0 10px rgba(0, 255, 127, 1);
    }

    .btn-danger {
      border-color: rgba(255, 20, 147, 0.6);
      color: #ff1493;
      box-shadow: 
        inset 0 1px 2px rgba(255, 20, 147, 0.2),
        inset 0 -1px 2px rgba(0, 0, 0, 0.5),
        0 2px 4px rgba(0, 0, 0, 0.6),
        0 0 8px rgba(255, 20, 147, 0.1);
    }

    .btn-danger:hover {
      border-color: #ff1493;
      color: #ff00ff;
      text-shadow: 0 0 10px rgba(255, 20, 147, 1);
      box-shadow: 
        inset 0 1px 2px rgba(255, 20, 147, 0.3),
        inset 0 -1px 2px rgba(0, 0, 0, 0.5),
        0 4px 8px rgba(0, 0, 0, 0.7),
        0 0 15px rgba(255, 20, 147, 0.4),
        0 0 25px rgba(255, 20, 147, 0.2);
    }

    .channel {
      text-transform: lowercase;
      letter-spacing: 1.5px;
    }

    h1, h2 {
      margin: clamp(12px, 2.5vh, 18px) 0 clamp(10px, 2vh, 14px) 0;
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 700;
      font-family: 'Orbitron', 'Share Tech Mono', 'Courier New', 'Courier', 'Lucida Console', 'Monaco', 'Consolas';
      color: #00ffff;
      display: flex;
      align-items: center;
      gap: clamp(8px, 2vw, 12px);
      text-shadow: 
        0 0 10px rgba(0, 255, 255, 0.6),
        0 0 20px rgba(0, 255, 255, 0.3),
        2px 2px 4px rgba(0, 0, 0, 0.8);
      letter-spacing: 3px;
      text-transform: uppercase;
      position: relative;
    }
    
    h1::before, h2::before {
      content: '▶';
      font-size: 0.6em;
      color: rgba(0, 255, 255, 0.5);
      margin-right: 8px;
      display: flex;
      align-items: center;
    }
    
    /* Remove play arrow from header h1 and h2 */
    header h1::before,
    header h2::before {
      content: none;
    }

    h1 span {
      font-weight: 400;
      text-transform: lowercase;
      letter-spacing: 2px;
    }
    
    h2 {
      font-size: clamp(16px, 3.5vw, 22px);
      color: rgba(0, 255, 255, 0.8);
      border-bottom: 1px solid rgba(0, 255, 255, 0.3);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    
    /* Header h2 should not have border, padding, or margin */
    header h2 {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }

    #metadata {
      margin-top: clamp(10px, 2vh, 14px);
      display: flex;
      align-items: center;
      gap: clamp(10px, 2.5vw, 14px);
      flex-wrap: wrap;
    }

    #metadata a {
      color: #ffd700;
      text-decoration: none;
      font-size: clamp(11px, 2vw, 13px);
      font-family: 'Share Tech Mono', 'Courier New', 'Courier', 'Lucida Console', 'Monaco', 'Consolas';
      padding: clamp(5px, 1vh, 6px) clamp(10px, 2vw, 12px);
      background: 
        linear-gradient(135deg, rgba(255, 215, 0, 0.15) 0%, rgba(255, 165, 0, 0.1) 100%);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 3px;
      transition: all 0.2s ease;
      text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
      box-shadow: 
        inset 0 1px 2px rgba(255, 215, 0, 0.2),
        0 0 8px rgba(255, 215, 0, 0.1);

<body x-data="radioApp()" x-init="init()">
  <div class="container">
    <!-- Player Header -->
    <header>
      <div class="container">
        <h1>
          <span class="logo-icon">📻</span>
          radio guaka
        </h1>

        <div class="header-controls-wrapper">
          <template x-if="srcUrl">
            <div class="header-controls-audio">
              <audio preload="auto" id="player" :src="srcUrl" x-ref="audioPlayer" style="display: none;">
              </audio>

              <div class="control-panel">
                <button @click="togglePlay()" class="btn btn-play-pause" style="touch-action: manipulation;">
                  <span x-text="isPlaying ? '⏸' : '▶'"></span>
                </button>
                
                <div class="time-display">
                  <span x-text="formatTime(currentTime)"></span>
                </div>
              </div>
            </div>
          </template>
          
          <template x-if="currentChannelData">
            <div class="header-channel-info">
              <div class="header-channel-info-row">
                <template x-if="currentChannelArtUrl">
                  <img class="header-channel-art"
                       :src="currentChannelArtUrl"
                       alt=""
                       loading="lazy" />
                </template>
                <div class="header-channel-text-block">
                  <h2>
                    <template x-if="currentChannelData.site">
                      <a :href="currentChannelData.site" target="_blank" style="color: inherit; text-decoration: none; transition: color 0.2s ease;" 
                         onmouseover="this.style.color='#ffff00'"
                         onmouseout="this.style.color=''">
                        <span x-text="currentChannelData.name.replace(/^flux_fm_/, 'flux ').replace(/_/g, ' ')"></span>
                      </a>
                    </template>
                    <template x-if="!currentChannelData.site">
                      <span x-text="currentChannelData.name.replace(/^flux_fm_/, 'flux ').replace(/_/g, ' ')"></span>
                    </template>
                  </h2>
                  <template x-if="currentSong">
                    <div class="current-song">
                      <span x-text="currentSong.artist && currentSong.title ? currentSong.artist + ' - ' + currentSong.title : (currentSong.title || '')"></span>
                      <button class="add-song-btn" 
                              @click="likeSong()" 
                              title="Like this song (public)">👍</button>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </div>
        
        <div class="volume-control">
          <span style="font-size: clamp(10px, 1.5vw, 12px); color: #aaa;">🔊</span>
          <input type="range" 
                 min="0" 
                 max="1" 
                 step="0.01" 
                 @input="setVolume($event.target.value)"
                 :value="volume"
                 title="Volume">
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <article>
      <div class="container">
        <div id="channels" style="clear:both; width: 100%; max-width: 100%;">
          <template x-for="channel in otherChannels" :key="channel.name">
            <a href="#"
               @click.prevent="navigateTo('#' + channel.name)"
               class="channel btn btn-large"
               :class="channel.playing ? 'btn-success' : 'btn-primary'">
              <span x-text="channel.name"></span>
            </a>
          </template>
          
          <template x-for="section in sortedSections" :key="section.name">
            <template x-if="getSectionChannels(section).length > 0">
              <div>
                <h2 style="width: 100%; margin: clamp(10px, 2vh, 15px) 0 clamp(6px, 1.2vh, 10px) 0; font-size: clamp(13px, 2.5vw, 15px); font-weight: 300; color: #fff;" x-text="section.name"></h2>
                
                <template x-for="channel in getSectionChannels(section)" :key="channel.name">
                  <a href="#"
                     @click.prevent="navigateTo('#' + channel.name)"
                     class="channel btn btn-large"
                     :class="channel.playing ? 'btn-success' : 'btn-primary'">
                    <span x-text="formatChannelName(channel.name, section.name)"></span>
                  </a>
                </template>
              </div>
            </template>
          </template>
        </div>

      </div>
    </article>
    
    <!-- Chat iframe -->
    <div class="chat-container" 
         :class="{ 'visible': isChatVisible }"
         x-show="(isChatVisible && window.innerWidth < 769) || window.innerWidth >= 769"
         x-ref="chatContainer">
      <iframe 
        :src="chatIframeSrc"
        x-ref="chatIframe"
        @load="onChatIframeLoad()">
      </iframe>
    </div>
    
    <!-- Mobile chat toggle button -->
    <template x-if="window.innerWidth < 769">
      <button 
        class="chat-toggle-btn"
        :class="{ 'is-open': isChatVisible }"
        @click="toggleChat()"
        :title="isChatVisible ? 'Close chat' : 'Open chat'">
        <span x-text="isChatVisible ? '✕' : '💬'"></span>
      </button>
    </template>
    
    <!-- Footer -->
    <footer>
      <div class="container">
          <p>
          ⌨ shortcuts:
          Change volume ↑ ↓
          Change channels ← →
          or press first letter of the name. ⏸ space bar to play/pause.

          <a target="_blank" href="https://github.com/guaka/radio-meteor/"><span>📦</span></a> <a target="_blank" href="https://github.com/guaka/radio">free software</a>
          <span x-text="buildDate" style="margin-left: 12px; color: rgba(0, 255, 255, 0.5); font-size: 10px;"></span>
        </p>
      </div>
    </footer>
  </div>

  <script src="/js/radio-2.js"></script>
  <script src="/js/channels.js"></script>
  <script src="/js/radio-3.js"></script>
</body>
</html>
