name: Android beta release

on:
  push:
    branches: [main]
    paths: ['android/**', 'public/channels.js', '.github/workflows/android-beta-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-beta-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify signed APK
        env:
          RADIO_BETA_KEYSTORE_BASE64: ${{ secrets.RADIO_BETA_KEYSTORE_BASE64 }}
          RADIO_BETA_STORE_PASSWORD: ${{ secrets.RADIO_BETA_STORE_PASSWORD }}
          RADIO_BETA_KEY_ALIAS: ${{ secrets.RADIO_BETA_KEY_ALIAS }}
          RADIO_BETA_KEY_PASSWORD: ${{ secrets.RADIO_BETA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RADIO_BETA_KEYSTORE_BASE64"
          export RADIO_BETA_KEYSTORE="$RUNNER_TEMP/radio-beta.jks"
          trap 'rm -f "$RADIO_BETA_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$RADIO_BETA_KEYSTORE_BASE64" | base64 --decode > "$RADIO_BETA_KEYSTORE"
          unset RADIO_BETA_KEYSTORE_BASE64
          epoch=$(date +%s)
          version="0.4.$(TZ=Europe/Lisbon date +%Y%m%d-%H%M%S)"
          cd android
          ./gradlew --no-daemon --no-configuration-cache testDebugUnitTest assembleRelease \
            "-PbetaVersionName=$version" "-PbetaVersionCode=$epoch"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/radio-guaka-beta.apk"
          (cd "$RUNNER_TEMP" && sha256sum radio-guaka-beta.apk > radio-guaka-beta.apk.sha256)
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "android-v$VERSION" "$RUNNER_TEMP/radio-guaka-beta.apk" "$RUNNER_TEMP/radio-guaka-beta.apk.sha256" \
            --target "$GITHUB_SHA" --title "Android beta $VERSION" --notes "Signed Android beta. See android/BETA.md for installation and updates." --prerelease
