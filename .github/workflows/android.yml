name: Android prototype
on:
  push:
    paths: ['android/**', 'src/frontend/channels.ts', '.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.detect.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          android=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            changed=$(git diff --name-only "$BASE_SHA" HEAD -- android/ src/frontend/channels.ts .github/workflows/android.yml)
            if [[ -z "$changed" ]]; then android=false; fi
          fi
          echo "android=$android" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify station catalogue
        run: node android/scripts/sync-stations.mjs --check
      - name: Build, lint and unit test
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: radio-guaka-prototype-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html

  instrumented-tests:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run offline device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/


  android-ci:
    if: always()
    needs: [changes, build, instrumented-tests]
    runs-on: ubuntu-latest
    env:
      CHANGES: ${{ needs.changes.result }}
      ANDROID: ${{ needs.changes.outputs.android }}
      BUILD: ${{ needs.build.result }}
      DEVICE_TESTS: ${{ needs.instrumented-tests.result }}
    steps:
      - name: Verify Android CI result
        run: |
          [[ "$CHANGES" == success ]] || exit 1
          case "$ANDROID" in
            true) [[ "$BUILD" == success && "$DEVICE_TESTS" == success ]] ;;
            false) [[ "$BUILD" == skipped && "$DEVICE_TESTS" == skipped ]] ;;
            *) exit 1 ;;
          esac
